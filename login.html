<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Keyword · Ingresar</title>
<style>
:root{--bg:#eef1f6;--navy:#0e1726;--text:#101828;--text-2:#5b6573;--border:#e6e9f0;--red:#b42318;--red-light:#fef3f2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue','Helvetica',Arial,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.box{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);max-width:380px;width:100%;padding:36px 32px;margin:16px}
h1{font-size:23px;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:-.01em}
p.sub{font-size:12px;color:var(--text-2);margin-bottom:26px}
label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.field{margin-bottom:16px}
input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--navy)}
.btn{width:100%;background:var(--navy);color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:600;border:none;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.6;cursor:default}
.error{font-size:12px;color:var(--red);background:var(--red-light);border-radius:8px;padding:9px 11px;margin-top:14px;display:none}
</style>
</head>
<body>
<form class="box" id="loginForm" autocomplete="on">
  <h1>Keyword · Dashboard Financiero</h1>
  <p class="sub">Ingresa con tu usuario y contraseña.</p>
  <div class="field">
    <label for="u">Usuario</label>
    <input id="u" name="username" type="text" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn" id="btn" type="submit">Iniciar sesión</button>
  <div class="error" id="err"></div>
</form>
<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('btn');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value,
      }),
    });
    if (res.ok) {
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Usuario o contraseña incorrectos.';
    err.style.display = 'block';
  } catch (e) {
    err.textContent = 'No se pudo conectar. Intenta de nuevo.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
