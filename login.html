<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Keyword · Ingresar</title>
<style>
:root{
  --bg:#eef1f6;--surface2:#f4f6fa;--border:#e6e9f0;--border-strong:#d4d9e3;
  --text:#101828;--text-2:#5b6573;--text-3:#98a2b3;--red:#b42318;--navy:#0e1726;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue','Helvetica',Arial,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}

.login-left{position:relative;flex:1 1 50%;background:var(--navy);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:54px 60px}
.login-left .lz{position:relative;z-index:2}
.login-left .kw-logo{padding:0;margin:0}
.login-left .kw-logo svg{height:30px}
.login-left .kw-logo svg path{fill:#fff}
.login-hero h2{font-size:64px;font-weight:800;line-height:1.0;letter-spacing:-2px;margin-bottom:22px}
.login-hero p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.66);max-width:430px;font-weight:400}
.login-c1{position:absolute;width:560px;height:560px;border-radius:50%;background:rgba(255,255,255,.035);top:-120px;right:-150px;z-index:1}
.login-c2{position:absolute;width:720px;height:720px;border-radius:50%;border:1px solid rgba(255,255,255,.05);bottom:-360px;left:-160px;z-index:1}
.login-dots{position:absolute;right:70px;bottom:70px;z-index:1;display:grid;grid-template-columns:repeat(9,12px);gap:12px;opacity:.5}
.login-dots span{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4)}

.login-right{flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:40px;background:#fff}
.login-box{max-width:380px;width:100%;padding:0}
.login-field{margin-bottom:20px}
.login-field label{color:var(--text);font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px;display:block}
.login-field input{width:100%;background:var(--surface2);border:1px solid var(--border-strong);color:var(--text);border-radius:11px;padding:15px 16px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.login-field input::placeholder{color:var(--text-3)}
.login-field input:focus{border-color:#9fbdf2;background:#fff}
.login-pass-wrap{position:relative}
.login-pass-wrap .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-3);background:none;border:none;display:flex;padding:4px}
.login-pass-wrap .eye svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
.login-remember{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text-2);margin-bottom:26px;cursor:pointer;user-select:none}
.login-remember input{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.login-error{color:var(--red);min-height:18px;margin-bottom:10px;font-size:12.5px}
.login-btn{width:100%;background:var(--navy);color:#fff;border-radius:11px;padding:15px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.92}
.login-btn:disabled{opacity:.6;cursor:default}

@media(max-width:860px){.login-left{display:none}.login-right{flex:1 1 100%}}
</style>
</head>

<div class="login-right">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-field">
      <label for="u">Usuario</label>
      <input type="text" id="u" name="username" placeholder="Ingrese su usuario o correo electrónico" autocomplete="username" required autofocus>
    </div>
    <div class="login-field">
      <label for="p">Contraseña</label>
      <div class="login-pass-wrap">
        <input type="password" id="p" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="eye" aria-label="Mostrar contraseña" onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password';"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <label class="login-remember"><input type="checkbox" id="remember"> Recuérdame</label>
    <div class="login-error" id="err"></div>
    <button class="login-btn" id="btn" type="submit">Iniciar Sesión</button>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('btn');
const err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value,
        remember: document.getElementById('remember').checked,
      }),
    });
    if (res.ok) {
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Usuario o contraseña incorrectos.';
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  } catch (e) {
    err.textContent = 'No se pudo conectar. Intenta de nuevo.';
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});
</script>
